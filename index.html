<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Atelier">
<meta name="theme-color" content="#F2EDE5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11100E" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Atelier · tu armario con IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EDE5; --surface:#FFFDF9; --surface-2:#E9E2D6; --surface-3:#DED5C6;
  --ink:#1C1A17; --muted:#7A736A; --line:rgba(28,26,23,.09);
  --accent:#B9502C; --accent-soft:rgba(185,80,44,.12); --ok:#2F6B4F; --danger:#B3352B;
  --shadow:0 1px 2px rgba(28,26,23,.05),0 10px 30px rgba(28,26,23,.06);
  --r:24px; --display:'Fraunces',Georgia,'Times New Roman',serif;
  --ui:'Manrope',-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11100E; --surface:#1B1A17; --surface-2:#26241F; --surface-3:#322F29;
  --ink:#F3EEE7; --muted:#9E978D; --line:rgba(255,255,255,.08);
  --accent:#E07A50; --accent-soft:rgba(224,122,80,.16); --ok:#6FBF95; --danger:#E26B5F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block}
#app{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 16px) 18px calc(var(--sab) + 120px)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 20px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:500;font-size:40px;line-height:1.02;margin:6px 0 0;letter-spacing:-.025em}
h1 em,h2 em{font-style:italic;color:var(--accent)}
h2{font-family:var(--display);font-weight:500;font-size:26px;margin:0;letter-spacing:-.02em}
h3{font-family:var(--display);font-weight:500;font-size:21px;margin:0;letter-spacing:-.01em;line-height:1.15}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.icon-btn.sm{width:36px;height:36px;box-shadow:none}
.sec-label{font-size:13px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec-label .opt,.opt{font-weight:600;color:var(--muted);font-size:12px}
.sec-label.row{justify-content:space-between}
.src{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;white-space:nowrap;transition:transform .15s,background .2s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{padding:7px 12px;font-size:13px}
.chip .n{opacity:.55;margin-left:5px;font-weight:700}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:18px}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:18px 0 0}

/* weather */
.weather{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;position:relative;overflow:hidden;padding:18px 20px 16px;border-radius:28px;color:#221d17;box-shadow:var(--shadow);isolation:isolate}
.weather::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.45),transparent 55%);z-index:-1}
.w-clear{background:linear-gradient(140deg,#FBE3A6 0%,#F4B566 50%,#EC8A5E 100%)}
.w-partly{background:linear-gradient(140deg,#F7E6C2 0%,#D8D7CF 55%,#AFC2D3 100%)}
.w-cloudy{background:linear-gradient(140deg,#E3E4E3 0%,#C3C8CD 55%,#A2ABB5 100%)}
.w-fog{background:linear-gradient(140deg,#ECE9E3 0%,#D3CFC6 60%,#BBB6AC 100%)}
.w-wind{background:linear-gradient(140deg,#DDEDEA 0%,#B4D1D2 55%,#8DB2B8 100%)}
.w-rain{background:linear-gradient(140deg,#A9C0D2 0%,#7896B0 55%,#577691 100%);color:#fff}
.w-storm{background:linear-gradient(140deg,#6D7489 0%,#454C62 55%,#2A3043 100%);color:#fff}
.w-snow{background:linear-gradient(140deg,#F6F9FC 0%,#D9E4EE 55%,#BACBDB 100%)}
.w-night{background:linear-gradient(140deg,#39426A 0%,#252C4D 55%,#151a31 100%)!important;color:#fff}
.w-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;opacity:.85}
.w-top span{display:flex;align-items:center;gap:5px}
.w-top{gap:10px}.w-top>span:first-child{min-width:0;overflow:hidden}.w-top>span:first-child>svg{flex:none}.w-top b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.w-top svg.i{width:16px;height:16px}
.w-src{flex:none;white-space:nowrap;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.35)}
.w-rain .w-src,.w-storm .w-src,.w-night .w-src{background:rgba(255,255,255,.16)}
.w-main{display:flex;align-items:center;justify-content:space-between;margin:6px 0 2px}
.w-temp{font-family:var(--display);font-size:84px;line-height:1;font-weight:400;letter-spacing:-.05em}
.w-ico svg{width:78px;height:78px;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.w-cond{font-weight:700;font-size:15px}
.w-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;font-weight:700;opacity:.88}
.w-stats span{display:flex;align-items:center;gap:4px}
.w-stats svg.i{width:15px;height:15px}
.w-advice{margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.w-rain .w-advice,.w-storm .w-advice,.w-night .w-advice{border-color:rgba(255,255,255,.18)}
.layers{display:flex;gap:3px}
.layers i{width:7px;height:16px;border-radius:3px;background:currentColor;opacity:.22}
.layers i.on{opacity:.9}

/* CTA */
.cta{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;border-radius:20px;background:var(--ink);color:var(--bg);font-weight:800;font-size:16.5px;border:0;margin-top:22px;box-shadow:0 10px 30px rgba(0,0,0,.14);transition:transform .15s}
.cta:active{transform:scale(.98)}
.cta svg.i{width:21px;height:21px}
.cta[disabled]{opacity:.85}
.cta.accent{background:var(--accent);color:#fff}
.cta-sub{text-align:center;font-size:12px;color:var(--muted);margin-top:9px;font-weight:600}
.spin{width:18px;height:18px;border-radius:50%;border:2.2px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite;display:inline-block;flex:none}
.spin.sm{width:12px;height:12px;border-width:2px}
@keyframes rot{to{transform:rotate(360deg)}}
.shimmer{background:linear-gradient(90deg,var(--surface-2) 0%,var(--surface) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:sh 1.3s ease-in-out infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* anchor */
.anchor{display:flex;align-items:center;gap:12px;margin-top:18px;padding:10px 10px 10px 10px;border-radius:20px;background:var(--accent-soft);border:1px solid var(--line)}
.anchor img{width:52px;height:52px;border-radius:14px;object-fit:cover}
.anchor>div{flex:1;min-width:0}
.anchor b{display:block;font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* looks */
.looks-list{display:flex;flex-direction:column;gap:16px}
.look{padding:12px 12px 14px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.look:nth-child(2){animation-delay:.07s}.look:nth-child(3){animation-delay:.14s}.look:nth-child(4){animation-delay:.21s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.look.out{animation:fade .3s forwards}
@keyframes fade{to{opacity:0;transform:scale(.96)}}
.collage{display:grid;grid-template-columns:1.25fr 1fr;grid-auto-rows:92px;gap:6px;grid-auto-flow:dense}
.tile{all:unset;position:relative;border-radius:16px;overflow:hidden;background:var(--surface-2);cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .lbl{position:absolute;left:7px;bottom:7px;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.82);color:#1c1a17;letter-spacing:.02em}
.tile .sw-ic{position:absolute;right:7px;top:7px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.82);color:#1c1a17;display:grid;place-items:center}
.tile .sw-ic svg.i{width:14px;height:14px}
.look-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:14px 4px 0}
.palette{display:flex;align-items:center;gap:4px;margin-top:8px}
.palette span{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--surface);box-shadow:0 0 0 1px var(--line);margin-right:-8px}
.palette em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);margin-left:14px}
.ring{position:relative;width:50px;height:50px;flex:none}
.ring svg{width:50px;height:50px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800}
.why{margin:10px 4px 0;font-size:14.5px;line-height:1.5;color:var(--ink);opacity:.86}
.tip{margin:10px 4px 0;font-size:13px;line-height:1.45;color:var(--muted);display:flex;gap:7px}
.tip svg.i{width:16px;height:16px;color:var(--accent);margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 4px 0}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--surface-2)}
.tag svg.i{width:14px;height:14px}
.look-actions{display:flex;gap:8px;margin-top:14px}
.look-actions .btn{padding:13px 10px;font-size:14px}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 16px;border-radius:15px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:14.5px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn svg.i{width:18px;height:18px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1.2}
.btn.soft{background:var(--surface-2);border-color:transparent;flex:1}
.btn.ghost{background:transparent;flex:none;width:50px;padding:13px 0}
.btn.danger{color:var(--danger);background:transparent}
.btn.full{width:100%;margin-top:10px}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.btn[disabled]{opacity:.5}

/* wardrobe */
.search{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px;color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;color:var(--ink);min-width:0}
.dots{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;margin:12px -18px 16px;padding:3px 18px}
.dots::-webkit-scrollbar{display:none}
.dot{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.dot.on{box-shadow:0 0 0 2px var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.item{all:unset;cursor:pointer;display:block;position:relative;border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s}
.item:active{transform:scale(.98)}
.item .ph{position:relative;aspect-ratio:4/5;background:var(--surface-2)}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.item .meta b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta span{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{display:flex;gap:4px;margin-top:6px}
.sw em{width:13px;height:13px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.badge{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.9);color:#1c1a17}
.badge svg.i{width:13px;height:13px}
.badge.ai{background:var(--ink);color:var(--bg)}
.badge.warn{background:#F3D27A}
.fav{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--accent)}
.fav svg.i{width:15px;height:15px;fill:currentColor}
.fab{position:fixed;z-index:25;right:max(18px,calc(50% - 262px));bottom:calc(var(--sab) + 96px);width:60px;height:60px;border-radius:22px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px rgba(185,80,44,.4);transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg.i{width:26px;height:26px;stroke-width:2.2}
.fab[hidden]{display:none}
.empty-small{color:var(--muted);text-align:center;padding:40px 0;font-weight:600}

/* onboarding */
.onb{padding:26px 22px;text-align:center;margin-top:18px}
.onb svg.big{width:92px;height:92px;stroke:var(--accent);fill:none;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.onb p{color:var(--muted);line-height:1.5;font-size:14.5px;margin:10px 0 0}
.steps{text-align:left;margin:20px 0 6px;display:flex;flex-direction:column;gap:12px}
.steps div{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45}
.steps b.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px}

/* tabbar */
.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 12px);width:min(calc(100% - 28px),430px);display:flex;gap:4px;padding:7px;border-radius:28px;background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.7);backdrop-filter:blur(20px) saturate(1.7);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.12)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:21px;font-size:11px;font-weight:800;color:var(--muted);background:none;border:0;transition:background .2s,color .2s}
.tab svg.i{width:22px;height:22px}
.tab.on{color:var(--ink);background:var(--surface-2)}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(15,12,10,.38);opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:calc(100dvh - var(--sat) - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);border-radius:30px 30px 0 0;padding:8px 18px calc(var(--sab) + 26px);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.85,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet:not(.open){visibility:hidden;transition:transform .38s cubic-bezier(.2,.85,.2,1),visibility 0s .38s}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--surface-3);margin:4px auto 14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}
.fl{display:block;font-size:13px;font-weight:800;margin:16px 0 0}
.fl>input[type=text],.fl>input[type=number],.fl>input[type=search],.fl>select,.fl textarea,.inp{display:block;width:100%;margin-top:7px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:600;outline:none;-webkit-appearance:none;appearance:none}
.fl textarea{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,monospace;font-weight:500}
.fl input:focus,.fl select:focus,.inp:focus{border-color:var(--accent)}
.fl .val{float:right;color:var(--accent);font-weight:800}
input[type=range]{width:100%;margin-top:12px;accent-color:var(--accent);height:28px}
.row-toggle{display:flex!important;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.tgl{-webkit-appearance:none;appearance:none;width:50px;height:30px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .2s;flex:none;margin:0}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s}
.tgl:checked{background:var(--ok)}
.tgl:checked::after{transform:translateX(20px)}
.seg6{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.seg6 button,.seg button{padding:11px 6px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px}
.seg6 button.on,.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;gap:6px;padding:5px;border-radius:17px;background:var(--surface-2);margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ed-photo{position:relative;border-radius:22px;overflow:hidden;background:var(--surface-2);aspect-ratio:1/1;max-height:340px;margin:0 auto;width:100%}
.ed-photo img{width:100%;height:100%;object-fit:contain}
.ai-scan{position:absolute;inset:auto 12px 12px 12px;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(20,18,16,.78);color:#fff;font-weight:700;font-size:13.5px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ed-photo::after{content:"";position:absolute;left:0;right:0;height:40%;top:-40%;background:linear-gradient(180deg,transparent,rgba(224,122,80,.25),transparent);pointer-events:none}
.ed-photo.scanning::after{animation:scan 1.6s ease-in-out infinite}
@keyframes scan{to{top:100%}}
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px}
.swatch{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;width:64px}
.swatch label{position:relative;display:block;width:48px;height:48px;cursor:pointer}
.swatch label span{display:block;width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 1px var(--line),inset 0 0 0 3px var(--surface)}
.swatch.add label span{display:grid;place-items:center;background:var(--surface);border:1.5px dashed var(--surface-3);box-shadow:none;font-size:22px;color:var(--muted);font-weight:500}

.stat span{font-size:11.5px;color:var(--muted);font-weight:700}
.actrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.actrow .btn{flex-direction:column;gap:5px;padding:12px 6px;font-size:12.5px}
.actrow .btn.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.note{font-size:13px;line-height:1.5;color:var(--muted);padding:12px 14px;border-radius:14px;background:var(--surface-2);margin-top:12px}

.alt-row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.alt-row img{width:58px;height:58px;border-radius:14px;object-fit:cover;flex:none}
.alt-row div{flex:1;min-width:0}
.alt-row b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alt-row span{font-size:12px;color:var(--muted);font-weight:600}
.alt-row.cur{border-color:var(--accent);background:var(--accent-soft)}
.pill{font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px;background:var(--surface-2)}

.diary{display:flex;flex-direction:column;gap:10px}
.dday{display:flex;gap:14px;align-items:center;padding:12px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.dday .dt{flex:none;width:48px;text-align:center}
.dday .dt b{display:block;font-family:var(--display);font-size:26px;font-weight:500;line-height:1}
.dday .dt span{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.thumbs{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.thumbs img{width:44px;height:44px;border-radius:11px;object-fit:cover;background:var(--surface-2)}
.thumbs small{flex-basis:100%;font-size:12px;font-weight:700;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:18px}
.cal div{aspect-ratio:1/1;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.cal div.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal div.today{box-shadow:0 0 0 2px var(--ink)}
.cal div.h{background:none;border:0;font-size:10.5px;letter-spacing:.06em}

.stats3 .stat b{font-size:30px}

.bars{display:flex;flex-direction:column;gap:9px;margin-top:6px}

.bar i{display:block;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i u{display:block;height:100%;background:var(--ink);border-radius:5px}

.toprow:first-child{border-top:0}
.toprow img{width:44px;height:44px;border-radius:12px;object-fit:cover}
.toprow div{flex:1;min-width:0}
.toprow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toprow span{font-size:12px;color:var(--muted);font-weight:600}

.pack-list img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:13px;background:var(--surface-2)}

.pday b{font-size:13px}
.pday .thumbs{margin-top:8px}
.pday p{margin:6px 0 0;font-size:12.5px;color:var(--muted)}

.toast{position:fixed;z-index:60;left:50%;top:calc(var(--sat) + 14px);transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:700;font-size:14px;max-width:calc(100% - 36px);box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.2,.85,.2,1);text-align:center}
.toast.on{transform:translate(-50%,0)}
.dialog{position:fixed;z-index:70;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(15,12,10,.45)}
.dialog.on{display:flex}
.dialog .box{width:100%;max-width:340px;background:var(--surface);border-radius:24px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}

.dialog .btns{display:flex;gap:8px}
.dialog .btns .btn{flex:1}
.dialog .btn.red{background:var(--danger);border-color:var(--danger);color:#fff}
.quick{display:flex;gap:8px;margin:-2px 0 12px}
.qbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 10px;border-radius:14px;border:1px dashed var(--surface-3);background:transparent;font-weight:800;font-size:13.5px;white-space:nowrap}
.qbtn svg.i{width:17px;height:17px;color:var(--accent)}
.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pk{all:unset;cursor:pointer;position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:var(--surface-2);box-shadow:0 0 0 1px var(--line);transition:box-shadow .15s}
.pk img{width:100%;height:100%;object-fit:contain;transition:opacity .15s}
.pk.on{box-shadow:0 0 0 3px var(--accent)}
.pk:not(.on) img{opacity:.4}
.pk .ck{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 0 0 1.5px rgba(0,0,0,.12);display:grid;place-items:center;color:#fff}
.pk.on .ck{background:var(--accent);box-shadow:none}
.pk .ck svg.i{width:14px;height:14px;stroke-width:2.6}
.pk .dup{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:800;padding:3px 7px;border-radius:999px;background:#F3D27A;color:#1c1a17}
.cta[disabled]{opacity:.45}
#filein,#fitsin{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('on'), 2600); }
function confirmBox(msg, yes = 'Eliminar') {
  return new Promise(res => {
    const d = $('#dialog'); $('#dlg-msg').textContent = msg; $('#dlg-yes').textContent = yes; d.classList.add('on');
    const done = v => { d.classList.remove('on'); $('#dlg-yes').onclick = $('#dlg-no').onclick = null; res(v); };
    $('#dlg-yes').onclick = () => done(true); $('#dlg-no').onclick = () => done(false);
  });
}

/* ---------- Render: shared ---------- */
function header(v) {
  const d = new Date(); const date = d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  const h = d.getHours(); const greet = h < 6 ? 'Buenas <em>noches</em>' : h < 13 ? 'Buenos <em>días</em>' : h < 21 ? 'Buenas <em>tardes</em>' : 'Buenas <em>noches</em>';
  const n = items().length;
  const t = { hoy: [date, greet], armario: [`${n} ${n === 1 ? 'prenda' : 'prendas'}`, 'Tu <em>armario</em>'], looks: ['Guardados y diario', 'Mis <em>looks</em>'], analisis: ['Tu estilo en datos', '<em>Análisis</em>'] }[v];
  return `<header class="top"><div><div class="eyebrow">${esc(t[0])}</div><h1>${t[1]}</h1></div><button class="icon-btn" data-act="settings" aria-label="Ajustes">${ic('gear')}</button></header>`;
}
function ring(score) {
  const s = clamp(Math.round(score || 0), 0, 100); const C = 2 * Math.PI * 21;
  const col = s >= 85 ? 'var(--ok)' : s >= 70 ? 'var(--accent)' : 'var(--muted)';
  return `<div class="ring" title="Puntuación del look"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="21" fill="none" stroke="var(--surface-2)" stroke-width="4"/><circle cx="25" cy="25" r="21" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(C * s / 100).toFixed(1)} ${C.toFixed(1)}"/></svg><b>${s}</b></div>`;
}
function collage(its, i) {
  const n = its.length;
  return `<div class="collage">${its.map((x, k) => {
    let st = ''; if (n === 1) st = 'grid-column:span 2;grid-row:span 3';
    else if (n === 2) st = 'grid-row:span 3'; else if (k === 0) st = `grid-row:span ${n === 4 || n === 6 ? 3 : 2}`;
    const swap = i != null;
    return `<button class="tile" style="${st}" ${swap ? `data-act="swap" data-i="${i}" data-item="${x.id}" aria-label="Cambiar ${esc(x.name)}"` : 'tabindex="-1"'}><img src="${esc(imgSrc(x))}" alt="${esc(x.name)}" loading="lazy"><span class="lbl">${esc(catShort(x.category))}</span>${swap ? `<span class="sw-ic">${ic('swap')}</span>` : ''}</button>`;
  }).join('')}</div>`;
}
function lookCard(o, i, mode = 'result') {
  const its = orderParts(o.itemIds.map(getDoc).filter(Boolean)); if (!its.length) return '';
  const hm = harmony(its.map(x => (x.colors || [])[0])); const w = S.weather;
  const eff = effWarmth(partsOf(its)), target = targetWarmth(w);
  const fit = Math.abs(eff - target) < .7 ? 'Abrigo ideal' : eff < target ? 'Algo fresco' : 'Algo abrigado';
  return `<article class="card look" id="look-${esc(o.id)}">
    ${collage(its, mode === 'result' ? i : null)}
    <div class="look-head"><div><h3>${esc(o.title || hm.type)}</h3><div class="palette">${its.map(x => `<span style="background:${esc((x.colors || [])[0] || '#ccc')}"></span>`).join('')}<em>${esc(hm.type)}</em></div></div>${ring(o.score ?? hm.score)}</div>
    ${o.why ? `<p class="why">${esc(o.why)}</p>` : ''}
    <div class="tags"><span class="tag">${ic('thermo')} ${fit} · ${w.feels ?? w.temp}°</span><span class="tag">${ic('target')} Armonía ${hm.score}</span>${o.occasion ? `<span class="tag">${esc((OCCASIONS.find(x => x.id === o.occasion) || {}).label || '')}</span>` : ''}</div>
    ${o.tip ? `<p class="tip">${ic('sparkle')}<span>${esc(o.tip)}</span></p>` : ''}
    ${mode === 'result' ? `<div class="look-actions">
      <button class="btn ghost" data-act="dislike" data-i="${i}" aria-label="No me gusta">${ic('thumbdown')}</button>
      <button class="btn soft ${o.saved ? 'done' : ''}" data-act="save-look" data-i="${i}" ${o.saved ? 'disabled' : ''}>${ic(o.saved ? 'check' : 'bookmark')} ${o.saved ? 'Guardado' : 'Guardar'}</button>
      <button class="btn primary ${o.worn ? 'done' : ''}" data-act="wear" data-i="${i}" ${o.worn ? 'disabled' : ''}>${ic('check')} ${o.worn ? 'Registrado' : 'Me lo pongo'}</button></div>` : ''}
  </article>`;
}
function onboarding() {
  return `<div class="card onb"><svg class="big" viewBox="0 0 24 24">${IC.hanger}</svg>
    <h2>Empieza por tu <em>armario</em></h2>
    <p>Haz fotos a tus prendas (mejor sobre fondo liso) y Atelier detectará su color y estilo para crear tus looks.</p>
    <div class="steps"><div><b class="n">1</b><span>Sube fotos de tus prendas: puedes elegir varias a la vez.</span></div>
    <div><b class="n">2</b><span>La IA identifica tipo, colores, estilo y nivel de abrigo. Puedes corregir lo que quieras.</span></div>
    <div><b class="n">3</b><span>En <b>Hoy</b>, elige la ocasión y te propone outfits según el tiempo.</span></div></div>
    <button class="cta accent" data-act="add">${ic('plus')} Añadir prendas</button>
    <button class="btn soft full" data-act="fits">${ic('download')} Importar desde Fits</button>
    ${canPaste() ? `<button class="btn soft full" data-act="paste">${ic('copy')} Pegar imagen copiada</button>` : ''}</div>`;
}

/* ---------- Render: Hoy ---------- */
function weatherCard() {
  const w = S.weather; const night = !w.isDay; const icn = night && (w.cond === 'clear' || w.cond === 'partly') ? 'moon' : w.cond;
  const ls = layersFor(w);
  const src = w.src === 'live' ? 'En directo' + (w.at ? ' · ' + new Date(w.at).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : '') : 'Manual';
  return `<button class="weather w-${w.cond} ${night ? 'w-night' : ''}" data-act="weather" aria-label="Ajustar el tiempo">
    <div class="w-top"><span>${ic('pin')}<b>${esc(w.city || 'Tu zona')}</b></span><span class="w-src">${src}</span></div>
    <div class="w-main"><div class="w-temp">${w.temp}°</div><div class="w-ico">${wic(icn)}</div></div>
    <div class="w-cond">${esc(CONDS[w.cond] || '')} · Sensación ${w.feels ?? w.temp}°${w.tmin != null ? ` · ${w.tmin}°/${w.tmax}°` : ''}</div>
    <div class="w-stats"><span>${ic('drop')} ${w.rainProb ?? 0}%</span><span>${ic('wind')} ${w.wind ?? 0} km/h</span><span>${ic('hum')} ${w.hum ?? '–'}%</span><span>${ic('uv')} UV ${w.uv ?? '–'}</span></div>
    <div class="w-advice"><span class="layers">${[1, 2, 3, 4].map(k => `<i class="${k <= ls ? 'on' : ''}"></i>`).join('')}</span><span>${esc(layerAdvice(w))}</span></div>
  </button>`;
}
function viewHoy() {
  let h = weatherCard();
  if (!S.loaded) return h + `<div class="card shimmer" style="height:130px;margin-top:18px"></div>`;
  if (!items().length) return h + onboarding();
  h += `<div class="sec-label">¿Para qué te vistes?</div><div class="chips">${OCCASIONS.map(o => `<button class="chip ${S.occasion === o.id ? 'on' : ''}" data-act="occ" data-id="${o.id}">${o.label}</button>`).join('')}</div>`;
  h += `<div class="sec-label">Estilo del día <span class="opt">opcional</span></div><div class="chips">${STYLES.map(s => `<button class="chip ${S.mood === s ? 'on' : ''}" data-act="mood" data-id="${s}">${cap(s)}</button>`).join('')}</div>`;
  const a = S.anchor && getDoc(S.anchor);
  if (a) h += `<div class="anchor"><img src="${esc(imgSrc(a))}" alt=""><div><div class="eyebrow">Prenda protagonista</div><b>${esc(a.name)}</b></div><button class="icon-btn sm" data-act="clear-anchor" aria-label="Quitar prenda protagonista">${ic('close')}</button></div>`;
  const mode = AI.mode();
  h += `<button class="cta" data-act="generate" ${S.generating ? 'disabled' : ''}>${S.generating ? '<span class="spin"></span> Diseñando tus looks…' : ic('sparkle') + ' Crear outfits'}</button>
    <div class="cta-sub">${mode === 'local' ? 'Motor de estilo local · activa la IA en Ajustes' : 'IA de Claude · color, estilo y tiempo actual'}</div>`;
  if (S.generating) h += `<div class="sec-label">Propuestas para hoy</div><div class="looks-list">${[0, 1].map(() => `<div class="card look"><div class="shimmer" style="height:276px;border-radius:16px"></div><div class="shimmer" style="height:18px;width:55%;margin:16px 4px 0;border-radius:9px"></div><div class="shimmer" style="height:12px;width:85%;margin:12px 4px 0;border-radius:6px"></div></div>`).join('')}</div>`;
  else if (S.results.length) h += `<div class="sec-label row"><span>Propuestas para hoy</span><span class="src">${S.source === 'ai' ? 'IA' : 'Motor local'}</span></div><div class="looks-list">${S.results.map((o, i) => lookCard(o, i)).join('')}</div><p class="hint">Toca una prenda del look para cambiarla por otra.</p>`;
  const off = items().length - activeItems().length;
  if (off) h += `<p class="hint">${off} ${off === 1 ? 'prenda está' : 'prendas están'} en la lavandería y no se proponen.</p>`;
  return h;
}

/* ---------- Render: Armario ---------- */
function filtered() {
  const q = norm(S.q);
  return items().filter(i => {
    if (S.cat !== 'all' && i.category !== S.cat) return false;
    if (S.cat === 'all' && S.color && !(i.colors || []).some(c => colorName(c) === S.color)) return false;
    if (S.cat !== 'all' && S.color && !(i.colors || []).some(c => colorName(c) === S.color)) return false;
    if (q) { const hay = norm([i.name, i.sub, catLabel(i.category), ...(i.styles || []), ...(i.colors || []).map(colorName), i.pattern].join(' ')); if (!q.split(/\s+/).every(t => hay.includes(t))) return false; }
    return true;
  });
}
function itemCard(i) {
  const badge = S.analyzing.has(i.id) ? `<span class="badge ai"><span class="spin sm"></span> Analizando</span>` : i.laundry ? `<span class="badge">${ic('wash')} Lavandería</span>` : i.needsReview ? `<span class="badge warn">Revisar</span>` : '';
  return `<button class="item" data-act="item" data-id="${esc(i.id)}"><div class="ph"><img src="${esc(imgSrc(i))}" alt="" loading="lazy">${badge}${i.fav ? `<span class="fav">${ic('heart')}</span>` : ''}</div>
    <div class="meta"><b>${esc(i.name)}</b><span>${esc(catLabel(i.category))}${i.sub ? ' · ' + esc(i.sub) : ''}</span><i class="sw">${(i.colors || []).map(c => `<em style="background:${esc(c)}"></em>`).join('')}</i></div></button>`;
}
function gridHTML() { const l = filtered(); if (!l.length) return `<p class="empty-small">No hay prendas con estos filtros.</p>`; return `<div class="grid">${l.map(itemCard).join('')}</div>`; }
function viewArmario() {
  if (!S.loaded) return `<div class="grid">${[0, 1, 2, 3].map(() => `<div class="card shimmer" style="aspect-ratio:4/5.9"></div>`).join('')}</div>`;
  const its = items(); if (!its.length) return onboarding();
  const cnt = c => its.filter(i => i.category === c).length;
  const pal = {}; its.forEach(i => (i.colors || []).slice(0, 1).forEach(c => { const n = colorName(c); pal[n] = (pal[n] || 0) + 1; }));
  const pl = Object.entries(pal).sort((a, b) => b[1] - a[1]);
  return `<div class="search">${ic('search')}<input id="q" type="search" placeholder="Buscar: “azul”, “vaqueros”, “elegante”…" value="${esc(S.q)}" autocomplete="off"></div>
    <div class="quick"><button class="qbtn" data-act="fits">${ic('download')} Importar desde Fits</button>${canPaste() ? `<button class="qbtn" data-act="paste">${ic('copy')} Pegar imagen</button>` : ''}</div>
    <div class="chips"><button class="chip ${S.cat === 'all' ? 'on' : ''}" data-act="cat" data-id="all">Todo<span class="n">${its.length}</span></button>${CATS.filter(c => cnt(c.id)).map(c => `<button class="chip ${S.cat === c.id ? 'on' : ''}" data-act="cat" data-id="${c.id}">${c.label}<span class="n">${cnt(c.id)}</span></button>`).join('')}</div>
    ${pl.length > 1 ? `<div class="dots">${pl.map(([n]) => `<button class="dot ${S.color === n ? 'on' : ''}" style="--c:${PAL_HEX[n]}" data-act="color" data-id="${esc(n)}" aria-label="${esc(n)}" title="${esc(n)}"></button>`).join('')}</div>` : '<div style="height:12px"></div>'}
    <div id="grid-wrap">${gridHTML()}</div>`;
}

/* ---------- Render: Looks ---------- */
function viewLooks() {
  const seg = `<div class="seg"><button class="${S.looksTab === 'saved' ? 'on' : ''}" data-act="looks-tab" data-id="saved">Guardados</button><button class="${S.looksTab === 'diary' ? 'on' : ''}" data-act="looks-tab" data-id="diary">Diario</button></div>`;
  if (S.looksTab === 'saved') {
    const os = outfits();
    if (!os.length) return seg + `<div class="card onb"><svg class="big" viewBox="0 0 24 24">${IC.bookmark}</svg><h2>Aún no hay <em>looks</em></h2><p>Cuando un outfit te guste, pulsa «Guardar» y lo tendrás aquí para repetirlo.</p></div>`;
    return seg + `<div class="minis">${os.map(o => { const its = orderParts(o.itemIds.map(getDoc).filter(Boolean)); const th = its.slice(0, 4); while (th.length < 4) th.push(null); return `<button class="mini" data-act="look" data-id="${esc(o.id)}"><div class="q">${th.map(x => x ? `<img src="${esc(imgSrc(x))}" alt="" loading="lazy">` : '<i></i>').join('')}</div><b>${esc(o.title || 'Look')}</b><span>${new Date(o.createdAt).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })} · ${its.length} prendas</span></button>`; }).join('')}</div>`;
  }
  const ls = logs();
  const days = new Set(ls.map(l => l.date));
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth(); const first = new Date(y, m, 1); const offset = (first.getDay() + 6) % 7; const dim = new Date(y, m + 1, 0).getDate();
  let cal = `<div class="eyebrow" style="margin:0 0 10px">${now.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })} · ${[...days].filter(d => d.startsWith(todayISO().slice(0, 7))).length} días con look</div><div class="cal">${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(d => `<div class="h">${d}</div>`).join('')}`;
  for (let k = 0; k < offset; k++) cal += '<div class="h"></div>';
  for (let dd = 1; dd <= dim; dd++) { const iso = todayISO(new Date(y, m, dd)); cal += `<div class="${days.has(iso) ? 'on' : ''} ${iso === todayISO() ? 'today' : ''}">${dd}</div>`; }
  cal += '</div>';
  if (!ls.length) return seg + cal + `<p class="hint">Pulsa «Me lo pongo» en un outfit para ir llenando tu diario. Así Atelier evita repetirte prendas y detecta las que tienes olvidadas.</p>`;
  return seg + cal + `<div class="diary">${ls.slice(0, 40).map(l => { const d = new Date(l.date + 'T12:00:00'); return l.entries.map(e => `<div class="dday"><div class="dt"><b>${d.getDate()}</b><span>${d.toLocaleDateString('es-ES', { month: 'short' })}</span></div><div class="thumbs">${orderParts(e.itemIds.map(getDoc).filter(Boolean)).map(x => `<img src="${esc(imgSrc(x))}" alt="${esc(x.name)}" loading="lazy">`).join('')}${e.title ? `<small>${esc(e.title)}</small>` : ''}</div></div>`).join(''); }).join('')}</div>`;
}

/* ---------- Render: Análisis ---------- */
function viewInsights() {
  if (!S.loaded) return `<div class="card shimmer" style="height:200px"></div>`;
  const its = items(); if (!its.length) return onboarding();
  const by = c => its.filter(i => i.category === c).length;
  const combos = (by('top') * by('bottom') + by('dress')) * Math.max(1, by('shoes'));
  const worn = logs().reduce((s, l) => s + l.entries.length, 0);
  const pal = {}; its.forEach(i => { const h = (i.colors || [])[0]; if (!h) return; const n = colorName(h); pal[n] = (pal[n] || 0) + 1; });
  const pl = Object.entries(pal).sort((a, b) => b[1] - a[1]);
  const neutralPct = Math.round(its.filter(i => isNeutral((i.colors || [])[0])).length / its.length * 100);
  const palMsg = neutralPct >= 85 ? `Tu armario es un ${neutralPct}% neutro: muy versátil, pero un par de prendas de color darían vida a tus looks.` : neutralPct >= 55 ? `Un ${neutralPct}% de tus prendas son neutras: el equilibrio ideal para combinar sin esfuerzo.` : `Solo un ${neutralPct}% de tus prendas son neutras: añadir básicos (blanco, negro, beige, marino) multiplicará tus combinaciones.`;
  const maxC = Math.max(...CATS.map(c => by(c.id)), 1);
  const forgotten = its.filter(i => !i.laundry && (!i.lastWorn || daysSince(i.lastWorn) >= 21)).sort((a, b) => (a.lastWorn ? 1 : 0) - (b.lastWorn ? 1 : 0) || (a.lastWorn || '').localeCompare(b.lastWorn || '')).slice(0, 12);
  const topW = its.filter(i => i.wearCount).sort((a, b) => b.wearCount - a.wearCount).slice(0, 5);
  let h = `<div class="stats3"><div class="stat card"><b>${its.length}</b><span>prendas</span></div><div class="stat card"><b>${combos > 999 ? (combos / 1000).toFixed(1) + 'k' : combos}</b><span>outfits posibles</span></div><div class="stat card"><b>${worn}</b><span>looks puestos</span></div></div>`;
  h += `<div class="card pad" style="margin-top:14px"><h3>Paleta de tu armario</h3><div class="palbar">${pl.map(([n, c]) => `<i style="flex:${c};background:${PAL_HEX[n]}" title="${esc(n)}"></i>`).join('')}</div><div class="legend">${pl.slice(0, 10).map(([n, c]) => `<span><em style="background:${PAL_HEX[n]}"></em>${esc(n)} · ${c}</span>`).join('')}</div><p class="note">${esc(palMsg)}</p></div>`;
  h += `<div class="card pad" style="margin-top:14px"><h3 style="margin-bottom:12px">Por categoría</h3><div class="bars">${CATS.map(c => `<div class="bar"><span>${c.label}</span><i><u style="width:${by(c.id) / maxC * 100}%"></u></i><b>${by(c.id)}</b></div>`).join('')}</div></div>`;
  if (forgotten.length) h += `<div class="sec-label row"><span>Prendas olvidadas</span><span class="opt">+21 días sin usar</span></div><div class="hscroll">${forgotten.map(i => `<button class="fcard" data-act="rescue" data-id="${esc(i.id)}"><img src="${esc(imgSrc(i))}" alt="" loading="lazy"><div><b>${esc(i.name)}</b><span>${i.lastWorn ? `hace ${daysSince(i.lastWorn)} días` : 'sin estrenar'} · Crear look</span></div></button>`).join('')}</div>`;
  if (topW.length) h += `<div class="card pad" style="margin-top:14px"><h3 style="margin-bottom:6px">Tus imprescindibles</h3>${topW.map(i => `<div class="toprow"><img src="${esc(imgSrc(i))}" alt=""><div><b>${esc(i.name)}</b><span>${i.wearCount} ${i.wearCount === 1 ? 'uso' : 'usos'}${i.price ? ` · ${(i.price / i.wearCount).toFixed(2).replace('.', ',')} € por uso` : ''}</span></div></div>`).join('')}</div>`;
  h += `<div class="card feature"><div class="fi">${ic('bag')}</div><h3>Compras inteligentes</h3><p>Descubre qué 3 prendas desbloquearían más combinaciones con lo que ya tienes, en vez de comprar por impulso.</p>
    ${S.shop ? `<div style="margin-top:12px">${S.shop.map(s => `<div class="sugg"><i class="c" style="background:${esc(s.color || '#ccc')}"></i><div><b>${esc(s.title)}</b><span>${esc(s.why)}</span></div></div>`).join('')}</div>` : ''}
    <button class="btn soft full" data-act="shop" ${S.shopBusy ? 'disabled' : ''}>${S.shopBusy ? '<span class="spin sm"></span> Analizando tu armario…' : ic('sparkle') + (S.shop ? ' Volver a analizar' : ' Analizar mi armario')}</button></div>`;
  h += `<div class="card feature"><div class="fi">${ic('suitcase')}</div><h3>Maleta inteligente</h3><p>Dime destino y días y te preparo una maleta cápsula con prendas que combinan entre sí y un look para cada día.</p><button class="btn soft full" data-act="pack">${ic('suitcase')} Preparar maleta</button></div>`;
  return h;
}

/* ---------- Render: main ---------- */
function render() {
  const v = S.view;
  const body = v === 'hoy' ? viewHoy() : v === 'armario' ? viewArmario() : v === 'looks' ? viewLooks() : viewInsights();
  $('#view').innerHTML = header(v) + body;
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === v));
  $('#fab').hidden = !(v === 'armario' && S.loaded && items().length);
}
function renderTabs() {
  const tabs = [['hoy', 'sparkle', 'Hoy'], ['armario', 'hanger', 'Armario'], ['looks', 'bookmark', 'Looks'], ['analisis', 'chart', 'Análisis']];
  $('#tabbar').innerHTML = tabs.map(([id, i, l]) => `<button class="tab" data-tab="${id}" data-act="tab">${ic(i)}<span>${l}</span></button>`).join('');
  $('#fab').innerHTML = ic('plus');
}
function go(v) { if (v === S.view) return; S.view = v; try { history.replaceState(null, '', '#' + v); } catch { } render(); window.scrollTo(0, 0); }

/* ---------- Sheets ---------- */
function openSheet(kind, data = {}) {
  S.sheet = { kind, ...data }; const el = $('#sheet');
  el.innerHTML = '<div class="grab"></div>' + sheetHTML(); el.scrollTop = 0;
  $('#backdrop').classList.add('on'); requestAnimationFrame(() => el.classList.add('open')); document.body.classList.add('locked');
}
function refreshSheet() { if (!S.sheet) return; const el = $('#sheet'); const st = el.scrollTop; el.innerHTML = '<div class="grab"></div>' + sheetHTML(); el.scrollTop = st; }
function closeSheet() { S.sheet = null; S.edit = null; $('#sheet').classList.remove('open'); $('#backdrop').classList.remove('on'); document.body.classList.remove('locked'); }
function sheetHTML() {
  const k = S.sheet.kind;

function canPaste() { return !S.inClaude && !!(navigator.clipboard && navigator.clipboard.read); }
async function pasteImages() {
  try {
    const list = await navigator.clipboard.read(); const files = [];
    for (const it of list) { const t = it.types.find(x => x.startsWith('image/')); if (t) { const b = await it.getType(t); files.push(new File([b], 'pegada.' + (t.split('/')[1] || 'png'), { type: t })); } }
    if (!files.length) { toast('No hay ninguna imagen copiada'); return; }
    onFiles(files);
  } catch { toast('No he podido leer la imagen copiada'); }
}
function newItemFrom(p, extra = {}) {
  const it = { id: uid('it'), type: 'item', name: 'Prenda nueva', category: 'top', sub: '', colors: p.colors, pattern: 'liso', styles: [], warmth: 2, formality: 2, waterproof: false, price: null, fav: false, laundry: false, wearCount: 0, lastWorn: null, createdAt: Date.now(), needsReview: true, ph: p.ph, ...extra };
  it.name = `${({ top: 'Parte de arriba', bottom: 'Parte de abajo', dress: 'Vestido', outer: 'Abrigo', shoes: 'Calzado', accessory: 'Accesorio' })[extra.category] || 'Prenda'} ${colorName(p.colors[0]).toLowerCase()}`;
  return it;
}
async function onFiles(files) {
  const arr = [...files].filter(f => /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)).slice(0, 24);
  if (!arr.length) return;
  toast(arr.length > 1 ? `Procesando ${arr.length} fotos…` : 'Procesando la foto…');
  const made = [];
  for (const f of arr) {
    try {
      const p = await processFile(f); const ref = await Store.saveImage(p);
      const it = { ...newItemFrom(p), ...ref };
      if (AI.canSee()) S.analyzing.add(it.id);
      await save(it); made.push({ it, blob: p.aiBlob });
    } catch (e) { toast('No he podido leer una de las fotos'); }
  }
  if (!made.length) return;
  S.view !== 'armario' ? go('armario') : render();
  if (made.length === 1) openItem(made[0].it.id, true);
  analyzeQueue(made);
}
async function analyzeQueue(made, keepCategory = false) {
  if (!AI.canSee()) { made.forEach(m => S.analyzing.delete(m.it.id)); render(); return; }
  for (const m of made) {
    try {
      const r = await analyzeBlob(m.blob, m.it.colors);
      if (keepCategory) delete r.category;
      const cur = getDoc(m.it.id); if (!cur) continue;
      await save({ ...clone(cur), ...r, needsReview: false });
      if (S.edit && S.edit.id === m.it.id) { const t = S.edit._touched || []; const merged = { ...S.edit }; for (const k of Object.keys(r)) if (!t.includes(k)) merged[k] = r[k]; merged.needsReview = false; S.edit = merged; }
    } catch (e) { made.forEach(x => S.analyzing.delete(x.it.id)); aiError(e); render(); if (S.sheet && S.sheet.kind === 'item') refreshSheet(); break; }
    S.analyzing.delete(m.it.id); render(); if (S.sheet && S.sheet.kind === 'item' && S.edit && S.edit.id === m.it.id) refreshSheet();
  }
}

async function fitsScan(files) {
  const arr = [...files].filter(f => /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)).slice(0, 30);
  if (!arr.length || !S.sheet || S.sheet.kind !== 'fits') return;
  const sh = S.sheet; sh.step = 'busy'; sh.total = arr.length; sh.done = 0; refreshSheet();
  const known = items().filter(i => i.ph).map(i => ({ ph: i.ph, lab: rgbToLab(...hexToRgb((i.colors || [])[0] || '#888888')) })); const crops = sh.crops || [];
  for (const f of arr) {
    const url = URL.createObjectURL(f);
    try {
      const img = await loadImg(url);
      for (const cv of segmentGarments(img)) {
        const ph = dhash(cv); const col = extractColors(cv)[0]; const lab = rgbToLab(...hexToRgb(col));
        if (crops.some(c => hamming(c.ph, ph) <= 4 && dE(c.lab, lab) < 7)) continue;
        const dup = known.some(k => hamming(k.ph, ph) <= 6 && dE(k.lab, lab) < 10);
        crops.push({ id: uid('c'), cv, ph, lab, dup, sel: !dup, prev: drawTo(cv, 220).toDataURL('image/jpeg', 0.75) });
      }
    } catch { }
    finally { URL.revokeObjectURL(url); }
    sh.done++; if (S.sheet === sh) refreshSheet();
    await sleep(0);
  }
  if (S.sheet !== sh) return;
  sh.crops = crops; sh.step = 'review'; refreshSheet();
}
async function fitsImport() {
  const sh = S.sheet; const sel = (sh.crops || []).filter(c => c.sel); if (!sel.length) { toast('Selecciona al menos una prenda'); return; }
  const cat = sh.cat !== 'auto' ? sh.cat : null;
  closeSheet(); go('armario'); toast(`Importando ${sel.length} prendas…`);
  const made = [];
  for (const c of sel) {
    try {
      const p = await processSource(c.cv); p.ph = c.ph; const ref = await Store.saveImage(p);
      const it = { ...newItemFrom(p, cat ? { category: cat } : {}), ...ref, source: 'fits', needsReview: !cat };
      if (AI.canSee()) S.analyzing.add(it.id);
      await save(it); made.push({ it, blob: p.aiBlob });
    } catch (e) { if (e && e.code === 'quota_exceeded') break; }
  }
  render(); toast(`${made.length} prendas importadas de Fits`);

function localPack(f) {
  const w = { temp: f.temp ?? 20, cond: f.rain ? 'rain' : 'partly', rainProb: f.rain ? 70 : 10, wind: 10, hum: 60, uv: 5, isDay: true }; w.feels = w.temp;
  const occ = f.plans.includes('trabajo') ? OCCASIONS[2] : f.plans.includes('noche') ? OCCASIONS[4] : OCCASIONS[0];
  const ctx = { weather: w, target: targetWarmth(w), wet: isWet(w), formality: occ.f, occasion: occ, mood: null, anchor: null, likes: new Set(), dislikes: new Set() };
  const all = activeItems(); const by = c => all.filter(i => i.category === c);
  const vers = new Map();
  const tops = by('top'), bots = by('bottom');
  for (const t of tops) for (const b of bots) { const s = scoreOutfit({ top: t, bottom: b }, ctx).total; if (s >= 72) { vers.set(t.id, (vers.get(t.id) || 0) + s); vers.set(b.id, (vers.get(b.id) || 0) + s); } }
  const pick = (arr, k) => [...arr].sort((a, b) => (vers.get(b.id) || 0) - (vers.get(a.id) || 0) || (scoreOutfit({ [a.category]: a }, ctx).wS - scoreOutfit({ [b.category]: b }, ctx).wS)).slice(0, k);
  const nT = clamp(Math.ceil(f.days * 0.75), 2, 7), nB = clamp(Math.ceil(f.days / 2.5), 1, 4);
  const selT = pick(tops, nT), selB = pick(bots, nB), selD = by('dress').slice(0, f.days > 3 ? 2 : 1).filter(() => f.plans.includes('noche') || f.plans.includes('playa'));
  const selS = by('shoes').sort((a, b) => scoreOutfit({ top: selT[0], bottom: selB[0], shoes: b }, ctx).total - scoreOutfit({ top: selT[0], bottom: selB[0], shoes: a }, ctx).total).slice(0, 2);
  const selO = needsOuter(w) ? by('outer').sort((a, b) => scoreOutfit({ top: selT[0], bottom: selB[0], outer: b }, ctx).total - scoreOutfit({ top: selT[0], bottom: selB[0], outer: a }, ctx).total).slice(0, 1) : [];
  const set = [...selT, ...selB, ...selD, ...selS, ...selO];
  const combos = [];
  for (const t of selT) for (const b of selB) { const p = { top: t, bottom: b }; if (selS[0]) p.shoes = selS[0]; if (selO[0]) p.outer = selO[0]; combos.push({ p, s: scoreOutfit(p, ctx).total }); }
  selD.forEach(d => { const p = { dress: d }; if (selS[0]) p.shoes = selS[0]; combos.push({ p, s: scoreOutfit(p, ctx).total }); });
  combos.sort((a, b) => b.s - a.s);
  const days = []; const usedTop = new Map();
  for (let d = 1; d <= f.days && combos.length; d++) {
    const c = combos.find(c => !usedTop.has((c.p.top || c.p.dress).id)) || combos[(d - 1) % combos.length];
    usedTop.set((c.p.top || c.p.dress).id, 1); if (usedTop.size >= selT.length + selD.length) usedTop.clear();
    days.push({ day: d, itemIds: Object.values(c.p).map(i => i.id), title: '', note: '' });
  }
  return { items: set.map(i => i.id), days, climate: f.temp != null ? `Planificado para unos ${f.temp} °C${f.rain ? ' con posibilidad de lluvia' : ''}.` : 'Sin temperatura indicada: he asumido unos 20 °C.', tips: ['Las prendas elegidas combinan entre sí: con pocas piezas tienes muchos looks.', f.rain ? 'Mete un paraguas plegable.' : 'Deja hueco para alguna compra.'] };
}

      S.edit[f] = v; touch(f);

      if (f === 'formality') $('#v-formality').textContent = FORM_L[v - 1];
    }
    if (t.dataset.color != null && t.dataset.color !== 'new') { const k = +t.dataset.color; const sw = $('#sw-' + k); if (sw) sw.style.background = t.value; const nm = $('#swn-' + k); if (nm) nm.textContent = colorName(t.value); }
  }
  if (S.sheet && S.sheet.kind === 'weather' && t.dataset.w) {
    const k = t.dataset.w; const v = t.type === 'checkbox' ? t.checked : +t.value; S.sheet.draft[k] = v;
    const lab = $('#wv-' + k); if (lab) lab.textContent = k === 'temp' ? v + '°' : k === 'wind' ? v + ' km/h' : k === 'uv' ? v : v + '%';
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'filein') { const fs = [...t.files]; t.value = ''; onFiles(fs); return; }
  if (t.id === 'fitsin') { const fs = [...t.files]; t.value = ''; fitsScan(fs); return; }
  if (S.sheet && S.sheet.kind === 'item' && S.edit && t.dataset.color != null) {
    const cols = [...(S.edit.colors || [])]; if (t.dataset.color === 'new') cols.push(t.value.toLowerCase()); else cols[+t.dataset.color] = t.value.toLowerCase();
    S.edit.colors = cols.slice(0, 3); touch('colors'); refreshSheet();
  }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['hoy', 'armario', 'looks', 'analisis'].includes(h) && h !== S.view) { S.view = h; render(); } });
document.addEventListener('paste', e => {
  if (S.sheet) return; const fs = [...(e.clipboardData ? e.clipboardData.files : [])].filter(f => f.type.startsWith('image/'));
  if (fs.length) { e.preventDefault(); onFiles(fs); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });

function makeIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, '#CF6A40'); g.addColorStop(1, '#8E3A1E'); x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.strokeStyle = '#FFF4EA'; x.lineWidth = 8; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath(); x.arc(90, 56, 14, Math.PI, Math.PI * 2.5); x.lineTo(90, 80); x.lineTo(36, 116); x.quadraticCurveTo(26, 126, 40, 128); x.lineTo(140, 128); x.quadraticCurveTo(154, 126, 144, 116); x.lineTo(90, 80); x.stroke();
    $('link[rel=apple-touch-icon]').href = c.toDataURL('image/png');
  } catch { }
}

/* ---------- Boot ---------- */
let _afterLoad = false;
async function afterLoad() {
  if (_afterLoad) return; _afterLoad = true;
  const st = settings();
  if (st.wx) S.weather = { ...defaultWx(), ...st.wx, isDay: (() => { const h = new Date().getHours(); return h >= 7 && h < 19; })() };
  render();
  autoWeather(true);
  setInterval(() => autoWeather(), 30 * 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') autoWeather(); });
}
async function boot() {
  renderTabs();
  const h = location.hash.slice(1); if (['hoy', 'armario', 'looks', 'analisis'].includes(h)) S.view = h;
  render();
  S.inClaude = !!(await claudeReady());
  if (S.inClaude) makeIcon(); else { try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch { } }
  await Promise.all([Store.init(), AI.init()]);
  let fellBack = false;
  const onDocs = async (docs, err) => {
    if (docs) { S.docs = new Map(docs.map(d => [d.id, d])); const first = !S.loaded; S.loaded = true; render(); if (first) afterLoad(); return; }
    if (err === 'timeout') { if (!S.loaded) toast('Conectando con tu armario…'); return; }
    if (!fellBack && !S.loaded) { fellBack = true; toast('No se pudo abrir tu armario en la nube; uso este dispositivo'); await Store.openIdb(); Store.subscribe(onDocs); }
  };
  Store.subscribe(onDocs);
  render();
}
boot();
</script>
